name: Build Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify tag matches version.txt
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version.txt ($version)."
          }

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pyinstaller Pillow

      - name: Build application folder
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Video Downloader" --collect-all PIL --add-data "version.txt;." app.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $installer = "installer_output\VideoDownloaderSetup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  VideoDownloaderSetup-$version.exe" | Set-Content "$installer.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $installer = "installer_output\VideoDownloaderSetup-$version.exe"
          gh release create "${{ github.ref_name }}" $installer "$installer.sha256" --title "Video Downloader $version" --generate-notes
